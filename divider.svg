<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="28" fill="transparent"/>
  <line x1="80" y1="14" x2="820" y2="14" stroke="url(#line)" stroke-width="1.2" opacity="0.55"/>
  <circle r="3.4" cy="14" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" values="120;780;120" dur="5.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle r="6" cy="14" fill="#c4b5fd" opacity="0.18">
    <animate attributeName="cx" values="120;780;120" dur="5.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
</svg>
