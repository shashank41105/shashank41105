<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03010a"/>
      <stop offset="45%" stop-color="#0b0620"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>
    <radialGradient id="og1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#a0d2eb" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="al" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ec8e3" stop-opacity="0"/>
      <stop offset="18%" stop-color="#7ec8e3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="1"/>
      <stop offset="82%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ec8e3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="circuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#6d5aa8" opacity="0.55"/>
    </pattern>
    <filter id="ob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="sg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg" x="-12%" y="-70%" width="124%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b">
        <animate attributeName="stdDeviation" values="2;7;2" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pg" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="3;8;3" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel">
      <rect x="50" y="48" width="800" height="224" rx="22"/>
    </clipPath>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>
  <rect width="900" height="320" fill="url(#dots)" opacity="0.38"/>

  <ellipse cx="88" cy="168" rx="170" ry="132" fill="url(#og1)" filter="url(#ob)">
    <animate attributeName="cy" values="168;150;168" dur="6.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </ellipse>
  <ellipse cx="822" cy="150" rx="178" ry="138" fill="url(#og2)" filter="url(#ob)">
    <animate attributeName="cy" values="150;168;150" dur="7.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </ellipse>
  <ellipse cx="450" cy="46" rx="120" ry="88" fill="url(#og3)" filter="url(#ob)">
    <animate attributeName="cx" values="450;474;450" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </ellipse>
  <ellipse cx="710" cy="280" rx="124" ry="92" fill="url(#og4)" filter="url(#ob)">
    <animate attributeName="cx" values="710;688;710" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </ellipse>

  <g opacity="0.55">
    <circle cx="46" cy="24" r="1.3" fill="#a0d2eb"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="172" cy="58" r="0.9" fill="#fff"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="18" r="1.5" fill="#7ec8e3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="498" cy="14" r="1.0" fill="#fff"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="648" cy="32" r="1.3" fill="#c4b5fd"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="798" cy="48" r="0.9" fill="#fff"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="868" cy="22" r="1.2" fill="#7c3aed"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="28" cy="228" r="1.0" fill="#fff"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="122" cy="292" r="1.5" fill="#7ec8e3"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="392" cy="304" r="1.2" fill="#a0d2eb"><animate attributeName="opacity" values="0.15;1;0.15" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="668" cy="292" r="1.3" fill="#a0d2eb"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="874" cy="258" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0.35" fill="none" stroke="url(#circuit)" stroke-width="1.1">
    <path d="M40 80 L120 80 L150 110 L150 250">
      <animate attributeName="stroke-dasharray" values="0 420;180 420;0 420" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M860 90 L780 90 L750 122 L750 250">
      <animate attributeName="stroke-dasharray" values="0 420;180 420;0 420" dur="6.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="44" y="42" width="812" height="236" rx="26" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-opacity="0.28" filter="url(#pg)">
    <animate attributeName="stroke-opacity" values="0.18;0.55;0.18" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>
  <rect x="50" y="48" width="800" height="224" rx="22" fill="url(#gf)"/>
  <rect x="50" y="48" width="800" height="224" rx="22" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.13"/>
  <rect x="52" y="50" width="796" height="78" rx="20" fill="url(#gh)"/>

  <g clip-path="url(#panel)">
    <rect x="-180" y="48" width="140" height="224" fill="url(#scan)" opacity="0.55">
      <animate attributeName="x" values="-180;940;-180" dur="7.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="76" cy="72" r="5" fill="#ff5f57" opacity="0.88"/>
  <circle cx="91" cy="72" r="5" fill="#febc2e" opacity="0.88"/>
  <circle cx="106" cy="72" r="5" fill="#28c840" opacity="0.88"/>
  <path d="M 58 60 L 58 52 L 68 52" fill="none" stroke="#a0d2eb" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <path d="M 842 60 L 842 52 L 832 52" fill="none" stroke="#a0d2eb" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <path d="M 58 260 L 58 268 L 68 268" fill="none" stroke="#a0d2eb" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <path d="M 842 260 L 842 268 L 832 268" fill="none" stroke="#a0d2eb" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>

  <rect x="718" y="60" width="114" height="24" rx="12" fill="url(#bg2)" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="775" y="76.5" font-family="'Courier New', Consolas, monospace" font-size="10.5" fill="#ddd6fe" text-anchor="middle" letter-spacing="1.1">AI SYSTEMS</text>

  <text x="450" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="6">PADALA SAI</text>
  <text x="450" y="176" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#a0d2eb" text-anchor="middle" letter-spacing="6" filter="url(#tg)">SHASHANK</text>

  <rect x="278" y="190" width="344" height="2" rx="1" fill="url(#al)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>
  <circle cx="280" cy="191" r="3.6" fill="#7ec8e3" filter="url(#sg)">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.2;5.4;3.2" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="622" cy="191" r="3.6" fill="#c4b5fd" filter="url(#sg)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.2;5.4;3.2" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <g>
    <text x="450" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#7ec8e3" text-anchor="middle" letter-spacing="2.4">
      Multi-agent systems  ·  RAG pipelines  ·  Autonomous SRE
      <animate attributeName="opacity" values="1;1;0;0;0;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#c4b5fd" text-anchor="middle" letter-spacing="2.4" opacity="0">
      LangGraph  ·  Local LLMs  ·  Production backends
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#38bdf8" text-anchor="middle" letter-spacing="2.4" opacity="0">
      Chaos engineering  ·  Incident automation  ·  Slack-native AI
      <animate attributeName="opacity" values="0;0;0;0;1;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="450" y="250" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1.1" opacity="0.38">LangGraph · FastAPI · Gemini · Groq · ChromaDB · Docker · Slack</text>

  <text x="74" y="256" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#94a3b8" opacity="0.7">Hyderabad, India</text>

  <circle cx="822" cy="252" r="4.2" fill="#7c3aed" opacity="0.55" filter="url(#sg)">
    <animate attributeName="r" values="4;7.2;4" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.08;0.55" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="822" cy="252" r="2.4" fill="#c4b5fd"/>
</svg>
