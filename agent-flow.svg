<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020e"/>
      <stop offset="100%" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="210" rx="18" fill="url(#bg)"/>
  <rect x="18" y="16" width="864" height="178" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="450" y="42" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#7ec8e3" text-anchor="middle" letter-spacing="2.6">LIVE SYSTEM GRAPH  ·  CHAOSMIND LOOP</text>

  <g fill="none" stroke="#334155" stroke-width="1.4">
    <path d="M118 108 H202"/>
    <path d="M278 108 H362"/>
    <path d="M438 108 H522"/>
    <path d="M598 108 H682"/>
  </g>
  <g fill="none" stroke="url(#pulse)" stroke-width="2">
    <path d="M118 108 H202">
      <animate attributeName="stroke-dasharray" values="0 90;90 90;0 90" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M278 108 H362">
      <animate attributeName="stroke-dasharray" values="0 90;90 90;0 90" dur="8s" begin="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M438 108 H522">
      <animate attributeName="stroke-dasharray" values="0 90;90 90;0 90" dur="8s" begin="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M598 108 H682">
      <animate attributeName="stroke-dasharray" values="0 90;90 90;0 90" dur="8s" begin="4.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="80" cy="108" r="28" fill="#0f172a" stroke="#7c3aed" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="108" r="34" fill="none" stroke="#7c3aed" stroke-opacity="0.18" filter="url(#g)">
        <animate attributeName="r" values="30;38;30" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="104" font-size="10" fill="#c4b5fd">01</text>
      <text x="80" y="118" font-size="10.5" fill="#e2e8f0">Plan</text>
    </g>
    <g>
      <circle cx="240" cy="108" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="240" y="104" font-size="10" fill="#7dd3fc">02</text>
      <text x="240" y="118" font-size="10.5" fill="#e2e8f0">Approve</text>
    </g>
    <g>
      <circle cx="400" cy="108" r="28" fill="#0f172a" stroke="#22d3ee" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="8s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="400" y="104" font-size="10" fill="#67e8f9">03</text>
      <text x="400" y="118" font-size="10.5" fill="#e2e8f0">Break</text>
    </g>
    <g>
      <circle cx="560" cy="108" r="28" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="8s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
      <text x="560" y="104" font-size="10" fill="#ddd6fe">04</text>
      <text x="560" y="118" font-size="10.5" fill="#e2e8f0">Judge</text>
    </g>
    <g>
      <circle cx="720" cy="108" r="28" fill="#0f172a" stroke="#34d399" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="8s" begin="6.4s" repeatCount="indefinite"/>
      </circle>
      <text x="720" y="104" font-size="10" fill="#6ee7b7">05</text>
      <text x="720" y="118" font-size="10.5" fill="#e2e8f0">Patch</text>
    </g>
    <g>
      <circle cx="820" cy="108" r="22" fill="#052e16" stroke="#34d399" stroke-width="1.3"/>
      <text x="820" y="112" font-size="10" fill="#bbf7d0">PR</text>
    </g>
  </g>

  <text x="450" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">Hypothesis  ’  Slack gate  ’  Fault injection  ’  Delta analysis  ’  Coder + GitHub PR</text>
</svg>
