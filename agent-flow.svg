<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="core-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Flow Particle Gradients -->
    <linearGradient id="flow-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="border-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="border-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="border-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-dot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 15px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 11px; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.8px; }
    .wire { stroke: #334155; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
    .pulse-wire { stroke: url(#flow-pulse); stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 24 220; animation: dash 2.8s linear infinite; }
    @keyframes dash {
      0% { stroke-dashoffset: 244; }
      100% { stroke-dashoffset: 0; }
    }
    .orbit { transform-origin: 475px 160px; animation: spin 16s linear infinite; }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="950" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Matrix Grid Lines -->
  <g opacity="0.08">
    <path d="M0 40 H950 M0 80 H950 M0 120 H950 M0 160 H950 M0 200 H950 M0 240 H950 M0 280 H950" stroke="#94a3b8" stroke-width="0.5" />
    <path d="M70 0 V320 M170 0 V320 M270 0 V320 M370 0 V320 M470 0 V320 M570 0 V320 M670 0 V320 M770 0 V320 M870 0 V320" stroke="#94a3b8" stroke-width="0.5" />
  </g>

  <!-- Connectors -->
  <!-- Wire 1: Node 1 to Node 2 -->
  <path d="M240 160 L350 160" class="wire" />
  <path d="M240 160 L350 160" class="pulse-wire" />

  <!-- Wire 2: Node 2 to Node 3 -->
  <path d="M600 160 L710 160" class="wire" />
  <path d="M600 160 L710 160" class="pulse-wire" />

  <!-- Node 1: Input / Perception -->
  <g transform="translate(50, 85)">
    <rect width="190" height="150" rx="12" fill="url(#card-grad)" stroke="url(#border-cyan)" stroke-width="1.2" />
    
    <!-- Radar / Sensor Icon -->
    <circle cx="44" cy="45" r="20" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="44" cy="45" r="12" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.6"/>
    <circle cx="44" cy="45" r="4" fill="#38bdf8" filter="url(#glow-dot)"/>
    <path d="M44 33 L44 45 L53 50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <text x="76" y="40" class="badge" fill="#38bdf8">STAGE 01</text>
    <text x="76" y="58" class="title">Perception</text>

    <!-- Details -->
    <circle cx="28" cy="95" r="2" fill="#38bdf8" />
    <text x="36" y="98" class="subtitle">Multi-Modal Inputs</text>
    
    <circle cx="28" cy="113" r="2" fill="#38bdf8" />
    <text x="36" y="116" class="subtitle">Context &amp; State Ingestion</text>

    <circle cx="28" cy="131" r="2" fill="#38bdf8" />
    <text x="36" y="134" class="subtitle">Prompt Tokenization</text>
  </g>

  <!-- Node 2: Agent Core (Highlighted) -->
  <g transform="translate(350, 65)">
    <!-- Core Glow Background -->
    <rect width="250" height="190" rx="14" fill="url(#core-card-grad)" stroke="url(#border-purple)" stroke-width="1.6" filter="url(#glow-core)" opacity="0.25" />
    <rect width="250" height="190" rx="14" fill="url(#core-card-grad)" stroke="url(#border-purple)" stroke-width="1.5" />

    <!-- Neural Matrix Icon -->
    <circle cx="46" cy="48" r="22" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.4" />
    <circle cx="46" cy="48" r="7" fill="#c7d2fe" filter="url(#glow-dot)" />
    <circle cx="37" cy="41" r="3" fill="#818cf8" />
    <circle cx="55" cy="41" r="3" fill="#818cf8" />
    <circle cx="46" cy="57" r="3" fill="#818cf8" />
    <line x1="37" y1="41" x2="46" y2="48" stroke="#818cf8" stroke-width="1.2" />
    <line x1="55" y1="41" x2="46" y2="48" stroke="#818cf8" stroke-width="1.2" />
    <line x1="46" y1="57" x2="46" y2="48" stroke="#818cf8" stroke-width="1.2" />

    <text x="82" y="42" class="badge" fill="#a5b4fc">AI REASONING CORE</text>
    <text x="82" y="62" class="title" font-size="16">Autonomous Agent</text>

    <!-- Core Features -->
    <circle cx="30" cy="100" r="2.5" fill="#818cf8" />
    <text x="40" y="104" class="subtitle">Chain-of-Thought (CoT) Plan</text>

    <circle cx="30" cy="120" r="2.5" fill="#818cf8" />
    <text x="40" y="124" class="subtitle">Dynamic Tool Orchestration</text>

    <circle cx="30" cy="140" r="2.5" fill="#818cf8" />
    <text x="40" y="144" class="subtitle">Vector Memory &amp; Reflection</text>

    <circle cx="30" cy="160" r="2.5" fill="#818cf8" />
    <text x="40" y="164" class="subtitle">Self-Correction Feedback Loop</text>
  </g>

  <!-- Node 3: Execution / Output -->
  <g transform="translate(710, 85)">
    <rect width="190" height="150" rx="12" fill="url(#card-grad)" stroke="url(#border-violet)" stroke-width="1.2" />
    
    <!-- Bolt / Action Icon -->
    <circle cx="44" cy="45" r="20" fill="#7e22ce" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.2" />
    <path d="M45 34 L37 46 L44 46 L43 56 L52 44 L45 44 Z" fill="#c084fc" filter="url(#glow-dot)"/>

    <text x="76" y="40" class="badge" fill="#c084fc">STAGE 03</text>
    <text x="76" y="58" class="title">Execution</text>

    <!-- Details -->
    <circle cx="28" cy="95" r="2" fill="#c084fc" />
    <text x="36" y="98" class="subtitle">API &amp; System Actions</text>
    
    <circle cx="28" cy="113" r="2" fill="#c084fc" />
    <text x="36" y="116" class="subtitle">Automated Code Generation</text>

    <circle cx="28" cy="131" r="2" fill="#c084fc" />
    <text x="36" y="134" class="subtitle">Verified Output &amp; Deploy</text>
  </g>

  <!-- Live Status Bar -->
  <g transform="translate(50, 275)">
    <circle cx="12" cy="12" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="16" class="subtitle" fill="#64748b">Autonomous Pipeline Active · Real-time Reasoning &amp; Execution</text>
  </g>
</svg>